services:
    _instanceof:
        Masilia\Bundle\IbexaAi\Ibexa\Field\Input\FieldInput:
            tags: ['masilia.ibexa_ai.field_input']
        Masilia\Contracts\IbexaAi\Os\Capability:
            tags: ['masilia.ibexa_ai.capability']
        Masilia\Bundle\IbexaAi\Ibexa\Field\Text\FieldValueStringifier:
            tags: ['masilia.ibexa_ai.stringifier']

    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@logger'
            $settings: '%ibexa_ai.connection%'
            $domains: '%ibexa_ai.os.domains%'
            $attachmentsDirectory: '%kernel.project_dir%/var/ai-attachments'

    Masilia\Bundle\IbexaAi\Ibexa\:
        resource: '../../Ibexa/'
        exclude:
            - '../../Ibexa/Field/FieldTypes.php'
            - '../../Ibexa/Field/Text/FieldStringValue.php'
            - '../../Ibexa/Field/Input/FieldInputs.php'
            - '../../Ibexa/Field/Text/FieldTexts.php'

    Masilia\Bundle\IbexaAi\Repository\:
        resource: '../../Repository/'

    Masilia\Bundle\IbexaAi\Image\:
        resource: '../../Image/'

    # The public API (Masilia\Contracts\IbexaAi): what other packages type-hint.
    Masilia\Contracts\IbexaAi\Image\ImageGenerator:
        alias: Masilia\Bundle\IbexaAi\Image\ProviderImageGenerator
    Masilia\Contracts\IbexaAi\Content\ContentWriter:
        alias: Masilia\Bundle\IbexaAi\Ibexa\Content\Write\RepositoryContentWriter
    Masilia\Contracts\IbexaAi\Content\ContentTypeSchemas:
        alias: Masilia\Bundle\IbexaAi\Ibexa\Schema\ContentTypeSchemas
    Masilia\Contracts\IbexaAi\Content\FieldTexts:
        alias: Masilia\Bundle\IbexaAi\Ibexa\Field\Text\FieldTexts
    Masilia\Contracts\IbexaAi\Content\Languages:
        alias: Masilia\Bundle\IbexaAi\Ibexa\Content\EnabledLanguages
    Masilia\Contracts\IbexaAi\Site\SiteLocations:
        alias: Masilia\Bundle\IbexaAi\Ibexa\Site\SiteaccessLocationResolver
    Masilia\Bundle\IbexaAi\Provider\:
        resource: '../../Provider/'

    # The AI OS: capabilities (tagged), their registry, access, audit and the three tools the model sees.
    Masilia\Bundle\IbexaAi\Os\:
        resource: '../../Os/'
        exclude: ['../../Os/Neuron/OsAgent.php', '../../Os/Neuron/OsSystemPrompt.php', '../../Os/Neuron/CapabilityTool.php', '../../Os/Neuron/ToolResult.php']

    Masilia\IbexaAi\Os\CapabilityRegistry:
        arguments:
            $capabilities: !tagged_iterator masilia.ibexa_ai.capability

    Masilia\IbexaAi\Provider\ProviderFactory: ~

    Masilia\Contracts\IbexaAi\Provider\ChatProviders:
        alias: Masilia\Bundle\IbexaAi\Provider\SiteaccessChatProviders

    Masilia\IbexaAi\Security\SecretCipher:
        factory: ['Masilia\IbexaAi\Security\SecretCipher', 'fromConfiguration']
        arguments:
            $configuredKey: '%ibexa_ai.encryption_key%'
            $appSecret: '%kernel.secret%'

    Masilia\Bundle\IbexaAi\Security\:
        resource: '../../Security/'

    Masilia\Bundle\IbexaAi\Command\:
        resource: '../../Command/'

    Masilia\Bundle\IbexaAi\Observability\:
        resource: '../../Observability/'
    Masilia\Contracts\IbexaAi\Observability\RequestLogger:
        alias: Masilia\Bundle\IbexaAi\Observability\DoctrineRequestLogger

    Masilia\Bundle\IbexaAi\Http\:
        resource: '../../Http/'
    Masilia\Contracts\IbexaAi\Http\ApiRequest:
        alias: Masilia\Bundle\IbexaAi\Http\SymfonyApiRequest

    Masilia\Bundle\IbexaAi\Controller\:
        resource: '../../Controller/'
        public: true
        tags: ['controller.service_arguments']

    Masilia\Bundle\IbexaAi\Observability\RequestLogFlushListener:
        tags:
            - { name: kernel.event_listener, event: kernel.terminate, method: onTerminate }
            - { name: kernel.event_listener, event: kernel.exception, method: onTerminate }
            - { name: kernel.event_listener, event: console.terminate, method: onTerminate }

    Masilia\Bundle\IbexaAi\Ibexa\Schema\ContentTypeSchemaSource:
        alias: Masilia\Bundle\IbexaAi\Ibexa\Schema\ContentTypeSchemas

    Masilia\Bundle\IbexaAi\Ibexa\Field\Input\FieldInputs:
        arguments:
            $adapters: !tagged_iterator masilia.ibexa_ai.field_input

    Masilia\Bundle\IbexaAi\Ibexa\Field\Text\FieldTexts:
        arguments:
            $stringifiers: !tagged_iterator masilia.ibexa_ai.stringifier

    Masilia\Bundle\IbexaAi\Chat\:
        resource: '../../Chat/'
        exclude:
            - '../../Chat/RunRefused.php'
            - '../../Chat/StartedRun.php'
            - '../../Chat/DTO/'

    Masilia\Bundle\IbexaAi\Os\Neuron\OsAgentFactory:
        public: true
        arguments:
            $skills: !tagged_iterator masilia.ibexa_ai.skill
