services:
    _instanceof:
        Masilia\Bundle\IbexaAi\Agent\Tool\FieldValueTransformerInterface:
            tags: ['masilia.ibexa_ai.field_value_transformer']
        Masilia\Contracts\IbexaAi\Os\Capability:
            tags: ['masilia.ibexa_ai.capability']
        Masilia\Bundle\IbexaAi\Field\FieldValueStringifierInterface:
            tags: ['masilia.ibexa_ai.stringifier']

    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@logger'
            $settings: '%ibexa_ai.connection%'
            $domains: '%ibexa_ai.os.domains%'
            $attachmentsDirectory: '%kernel.project_dir%/var/ai-attachments'

    Masilia\Bundle\IbexaAi\Ibexa\:
        resource: '../../Ibexa/'
        exclude: '../../Ibexa/ContentContext.php'

    Masilia\Bundle\IbexaAi\Repository\:
        resource: '../../Repository/'

    Masilia\Bundle\IbexaAi\Image\:
        resource: '../../Image/'

    # The public API (Masilia\Contracts\IbexaAi): what other packages type-hint.
    Masilia\Contracts\IbexaAi\Image\ImageGenerator:
        alias: Masilia\Bundle\IbexaAi\Image\ProviderImageGenerator
    Masilia\Contracts\IbexaAi\Content\ContentWriter:
        alias: Masilia\Bundle\IbexaAi\Content\Write\RepositoryContentWriter
    Masilia\Contracts\IbexaAi\Content\ContentTypeSchemas:
        alias: Masilia\Bundle\IbexaAi\Agent\Block\ContentTypeSchemas
    Masilia\Contracts\IbexaAi\Content\Languages:
        alias: Masilia\Bundle\IbexaAi\Content\EnabledLanguages
    Masilia\Contracts\IbexaAi\Site\SiteLocations:
        alias: Masilia\Bundle\IbexaAi\Agent\Tool\SiteaccessLocationResolver
    Masilia\Bundle\IbexaAi\Content\:
        resource: '../../Content/'
    Masilia\Bundle\IbexaAi\Admin\:
        resource: '../../Admin/'

    # The AI OS: capabilities (tagged), their registry, access, audit and the three tools the model sees.
    Masilia\Bundle\IbexaAi\Os\:
        resource: '../../Os/'

    Masilia\IbexaAi\Os\CapabilityRegistry:
        arguments:
            $capabilities: !tagged_iterator masilia.ibexa_ai.capability

    Masilia\IbexaAi\Provider\ProviderFactory: ~

    Masilia\IbexaAi\Security\SecretCipher:
        factory: ['Masilia\IbexaAi\Security\SecretCipher', 'fromConfiguration']
        arguments:
            $configuredKey: '%ibexa_ai.encryption_key%'
            $appSecret: '%kernel.secret%'

    Masilia\Bundle\IbexaAi\Security\:
        resource: '../../Security/'
        exclude: ['../../Security/Access.php', '../../Security/RequiresAccess.php']

    Masilia\Bundle\IbexaAi\Command\:
        resource: '../../Command/'

    Masilia\Bundle\IbexaAi\Llm\:
        resource: '../../Llm/'
        exclude: '../../Llm/NeuronTextGenerator.php'

    Masilia\Bundle\IbexaAi\Observability\:
        resource: '../../Observability/'

    Masilia\Bundle\IbexaAi\Http\:
        resource: '../../Http/'

    Masilia\Bundle\IbexaAi\Controller\:
        resource: '../../Controller/'
        public: true
        tags: ['controller.service_arguments']

    Masilia\Bundle\IbexaAi\Observability\RequestLogFlushListener:
        tags:
            - { name: kernel.event_listener, event: kernel.terminate, method: onTerminate }
            - { name: kernel.event_listener, event: kernel.exception, method: onTerminate }
            - { name: kernel.event_listener, event: console.terminate, method: onTerminate }

    Masilia\Bundle\IbexaAi\Agent\Block\ContentTypeSchemaSource:
        alias: Masilia\Bundle\IbexaAi\Agent\Block\ContentTypeSchemas

    Masilia\Bundle\IbexaAi\Agent\Tool\FieldValueTransformerRegistry:
        arguments:
            $transformers: !tagged_iterator masilia.ibexa_ai.field_value_transformer

    Masilia\Bundle\IbexaAi\Field\FieldValueStringifierRegistry:
        arguments:
            $stringifiers: !tagged_iterator masilia.ibexa_ai.stringifier

    Masilia\Bundle\IbexaAi\Agent\:
        resource: '../../Agent/'
        exclude:
            - '../../Agent/AiAssistantAgent.php'
            - '../../Agent/AgentFactory.php'
            - '../../Agent/AgentSystemPrompt.php'
            - '../../Agent/RunRefused.php'
            - '../../Agent/StartedRun.php'
            - '../../Agent/Neuron/'
            - '../../Agent/DTO/'
            - '../../Agent/Tool/ToolResult.php'
            - '../../Agent/Tool/FieldValueTransformerRegistry.php'

    Masilia\Bundle\IbexaAi\Field\:
        resource: '../../Field/'
        exclude:
            - '../../Field/FieldStringValue.php'
            - '../../Field/FieldValueStringifierRegistry.php'
            - '../../Field/Stringifier/'

    Masilia\Bundle\IbexaAi\Field\Stringifier\:
        resource: '../../Field/Stringifier/'

    Masilia\Bundle\IbexaAi\Agent\AgentFactory:
        public: true
        arguments:
            $skills: !tagged_iterator masilia.ibexa_ai.skill
