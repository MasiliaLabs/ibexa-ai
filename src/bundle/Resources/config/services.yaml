services:
    _instanceof:
        Masilia\IbexaAi\Ibexa\Field\Input\FieldInput:
            tags: ['masilia.ibexa_ai.field_input']
        Masilia\Contracts\IbexaAi\Os\Capability:
            tags: ['masilia.ibexa_ai.capability']
        Masilia\IbexaAi\Ibexa\Field\Text\FieldValueStringifier:
            tags: ['masilia.ibexa_ai.stringifier']

    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $aiLogger: '@logger'
            $settings: '%ibexa_ai.connection%'
            $domains: '%ibexa_ai.os.domains%'
            $attachmentsDirectory: '%kernel.project_dir%/var/ai-attachments'
            $matrixFile: '%masilia_ibexa_ai.os_coverage_file%'

    # The implementation lives in src/lib (as in the Ibexa packages); this file only wires it.
    Masilia\IbexaAi\Ibexa\:
        resource: '../../../lib/Ibexa/'
        exclude:
            - '../../../lib/Ibexa/Field/FieldTypes.php'
            - '../../../lib/Ibexa/Field/Text/FieldStringValue.php'
            - '../../../lib/Ibexa/Field/Input/FieldInputs.php'
            - '../../../lib/Ibexa/Field/Text/FieldTexts.php'

    Masilia\IbexaAi\Persistence\Repository\:
        resource: '../../../lib/Persistence/Repository/'

    Masilia\IbexaAi\Image\:
        resource: '../../../lib/Image/'

    # The public API (Masilia\Contracts\IbexaAi): what other packages type-hint.
    Masilia\Contracts\IbexaAi\Image\ImageGenerator:
        alias: Masilia\IbexaAi\Image\ProviderImageGenerator
    Masilia\Contracts\IbexaAi\Content\ContentWriter:
        alias: Masilia\IbexaAi\Ibexa\Content\Write\RepositoryContentWriter
    Masilia\Contracts\IbexaAi\Content\ContentTypeSchemas:
        alias: Masilia\IbexaAi\Ibexa\Schema\ContentTypeSchemas
    Masilia\Contracts\IbexaAi\Content\FieldTexts:
        alias: Masilia\IbexaAi\Ibexa\Field\Text\FieldTexts
    Masilia\Contracts\IbexaAi\Content\Languages:
        alias: Masilia\IbexaAi\Ibexa\Content\EnabledLanguages
    Masilia\Contracts\IbexaAi\Site\SiteLocations:
        alias: Masilia\IbexaAi\Ibexa\Site\SiteaccessLocationResolver
    Masilia\IbexaAi\Provider\:
        resource: '../../../lib/Provider/'

    # The AI OS: capabilities (tagged), their registry, access, audit and the three tools the model sees.
    Masilia\IbexaAi\Os\:
        resource: '../../../lib/Os/'
        exclude: ['../../../lib/Os/Neuron/OsAgent.php', '../../../lib/Os/Neuron/OsSystemPrompt.php', '../../../lib/Os/Neuron/CapabilityTool.php', '../../../lib/Os/Neuron/ToolResult.php']

    Masilia\IbexaAi\Os\CapabilityRegistry:
        arguments:
            $capabilities: !tagged_iterator masilia.ibexa_ai.capability

    Masilia\IbexaAi\Provider\ProviderFactory: ~

    Masilia\Contracts\IbexaAi\Provider\ChatProviders:
        alias: Masilia\IbexaAi\Provider\SiteaccessChatProviders

    Masilia\IbexaAi\Security\SecretCipher:
        factory: ['Masilia\IbexaAi\Security\SecretCipher', 'fromConfiguration']
        arguments:
            $configuredKey: '%ibexa_ai.encryption_key%'
            $appSecret: '%kernel.secret%'

    Masilia\IbexaAi\Security\:
        resource: '../../../lib/Security/'
        exclude: ['../../../lib/Security/SecretCipher.php', '../../../lib/Security/SecretDecryptionException.php']

    Masilia\Bundle\IbexaAi\Command\:
        resource: '../../Command/'

    # The menu item and the guards of the admin API (found by what they implement), and the flush of the request log.
    Masilia\Bundle\IbexaAi\EventListener\:
        resource: '../../EventListener/'

    Masilia\IbexaAi\Observability\:
        resource: '../../../lib/Observability/'
        exclude: '../../../lib/Observability/ModelCallClock.php'
    Masilia\Contracts\IbexaAi\Observability\RequestLogger:
        alias: Masilia\IbexaAi\Observability\DoctrineRequestLogger
    Masilia\Contracts\IbexaAi\Observability\UsageRecorder:
        alias: Masilia\IbexaAi\Observability\ModelCallRecorder

    Masilia\Bundle\IbexaAi\Http\:
        resource: '../../Http/'
    Masilia\Contracts\IbexaAi\Http\ApiRequest:
        alias: Masilia\Bundle\IbexaAi\Http\SymfonyApiRequest

    Masilia\Bundle\IbexaAi\Controller\:
        resource: '../../Controller/'
        public: true
        tags: ['controller.service_arguments']

    Masilia\Bundle\IbexaAi\EventListener\RequestLogFlushListener:
        tags:
            - { name: kernel.event_listener, event: kernel.terminate, method: onTerminate }
            - { name: kernel.event_listener, event: kernel.exception, method: onTerminate }
            - { name: kernel.event_listener, event: console.terminate, method: onTerminate }

    Masilia\IbexaAi\Ibexa\Schema\ContentTypeSchemaSource:
        alias: Masilia\IbexaAi\Ibexa\Schema\ContentTypeSchemas

    Masilia\IbexaAi\Ibexa\Field\Input\FieldInputs:
        arguments:
            $adapters: !tagged_iterator masilia.ibexa_ai.field_input

    Masilia\IbexaAi\Ibexa\Field\Text\FieldTexts:
        arguments:
            $stringifiers: !tagged_iterator masilia.ibexa_ai.stringifier

    Masilia\IbexaAi\Chat\:
        resource: '../../../lib/Chat/'
        exclude:
            - '../../../lib/Chat/Refusal.php'
            - '../../../lib/Chat/RunRefused.php'
            - '../../../lib/Chat/StartedRun.php'
            - '../../../lib/Chat/DTO/'

    Masilia\IbexaAi\Os\Neuron\OsAgentFactory:
        public: true
        arguments:
            $skills: !tagged_iterator masilia.ibexa_ai.skill
