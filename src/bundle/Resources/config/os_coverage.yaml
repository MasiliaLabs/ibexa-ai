# Which capability answers each admin route of Ibexa (routes named "ibexa.*", REST excluded), or why none should.
# `masilia:ai:os:coverage --strict` fails when a route is in neither section: a new admin screen needs an answer.
#
# capabilities: route => capability name. A capability that is not written yet makes the route "planned".
# out_of_scope: route, or prefix ending in "*", => the reason it is not an action of an administrator.
